[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/scrollback"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
# ---- UI stack (docs/PLAN.md D1): gpui-pre snapshot + gpui-component 0.9, the same pins as the
# sibling apps. Pinned exactly; bump all of these together, starting in toolbox-rs.
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11" }
# gpui-component's base: the rich text view (`TextView`, its style, range highlights and the
# window-wide text selection) that `sb_ui::markdown` renders prompts and replies with (PLAN D11).
gpui-base = "=0.9.0"
# The tree-sitter grammars `sb_ui::syntax` highlights fenced code with (PLAN §9): gpui-component's
# `tree-sitter-languages`, as dv enables them, less those whose C code aborts the process on some
# input, which nothing can catch (`sb_ui::syntax`'s `grammars_never_abort`): Bash (nested
# heredocs), Kotlin (nested string templates) and YAML (deep indentation).
gpui-component = { version = "=0.9.0", features = [
    "tree-sitter-astro",
    "tree-sitter-c",
    "tree-sitter-cmake",
    "tree-sitter-cpp",
    "tree-sitter-csharp",
    "tree-sitter-css",
    "tree-sitter-diff",
    "tree-sitter-ejs",
    "tree-sitter-elixir",
    "tree-sitter-erb",
    "tree-sitter-go",
    "tree-sitter-graphql",
    "tree-sitter-html",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-jsdoc",
    "tree-sitter-lua",
    "tree-sitter-make",
    "tree-sitter-markdown",
    "tree-sitter-php",
    "tree-sitter-proto",
    "tree-sitter-python",
    "tree-sitter-ruby",
    "tree-sitter-rust",
    "tree-sitter-scala",
    "tree-sitter-sql",
    "tree-sitter-svelte",
    "tree-sitter-swift",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-zig",
] }
# What `sb_ui::syntax` runs those grammars with, to give up on a parse or a query past its
# deadline. gpui-component's own pin; already in the tree.
tree-sitter = "=0.26.13"

# ---- internal crates (docs/PLAN.md §3)
sb_core = { path = "crates/sb_core" }
sb_test_support = { path = "crates/sb_test_support" }
sb_ui = { path = "crates/sb_ui" }

# ---- toolbox-rs (github.com/kylekz/toolbox-rs, docs/PLAN.md §3): the shared crates, a git
# dependency pinned by tag, never a branch. A change to any goes to toolbox-rs first, then a new
# tag here. toolbox-rs owns the gpui pin: its tag's gpui-pre and gpui-component versions are the
# ones above.
# Light/dark and the window materials (`sb_ui::appearance`, PLAN D13).
gpui_appearance = { git = "https://github.com/kylekz/toolbox-rs", tag = "v0.5.2" }
# The in-app driver (`enabled` from `sb_ui`'s and `scrollback`'s `automation` features, its no-op
# stand-ins otherwise) and the scenario runner `sb_e2e` wraps.
gpui_automation = { git = "https://github.com/kylekz/toolbox-rs", tag = "v0.5.2" }
gpui_automation_runner = { git = "https://github.com/kylekz/toolbox-rs", tag = "v0.5.2" }
# `wsl.exe` and `ssh`, in a process tree of their own with no console window (PLAN D7). gpui-free.
toolbox_process = { git = "https://github.com/kylekz/toolbox-rs", tag = "v0.5.2" }
# The catalogue: SQLite on rusqlite, with migrations and checked backups (PLAN D3). gpui-free.
toolbox_store = { git = "https://github.com/kylekz/toolbox-rs", tag = "v0.5.2" }

# ---- shared third-party
anyhow = "1.0"
# What `TextView`'s highlighter, which runs without a context, asks the reader service for
# (`sb_ui::services::reader::highlights`). gpui's own; already in the tree.
async-channel = "2.5"
# Images inside a transcript are base64 (`sb_core::transcript::Stored`).
base64 = "0.22"
# The catalogue's daily backup is named by the local calendar day (`toolbox_store`'s own pin).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6"
env_logger = "0.11"
# The size of an image in a transcript, read from its header before gpui decodes it
# (`sb_ui::services::reader`); gpui's own pin, the formats a transcript holds.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
log = "0.4"
# The Markdown parser gpui-base's `TextView` uses: `sb_ui::markdown` sanitises a body at the
# spans it reports before `TextView` sees it. Already in the tree through gpui-base.
markdown = "1.0.0"
# The general category of a character (`sb_ui::hostile`: combining marks). Already in the tree.
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }
# A link's real destination, its host as the browser would read it (`sb_ui::markdown`). Already
# in the tree.
url = "2.5"
pretty_assertions = "1.4"
# Apple systems only: `fsync` without the full flush std's `sync_all` does there
# (`sb_core::archive`).
rustix = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Segment and version hashes (PLAN §4.1).
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
# Archive and location ids.
uuid = { version = "1", features = ["v4"] }
# Windows only: the rename that puts a segment in place (`sb_core::archive`). toolbox-rs's pin.
windows-sys = "0.61"
# Segments are zstd frames (PLAN §4.1).
zstd = "0.13"

[profile.dev]
debug = "limited"

# gpui is unusably slow unoptimised; dependencies build at opt-level 2 even in dev, while the
# workspace's own crates stay at 0 for fast incremental builds.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
debug = "limited"
lto = "thin"
codegen-units = 16
