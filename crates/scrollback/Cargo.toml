[package]
name = "scrollback"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "scrollback: backs up, archives and reads coding-agent transcripts (docs/PLAN.md)"
build = "build.rs"

[[bin]]
name = "scrollback"
path = "src/main.rs"

# Two shapes, both linted by `script/check` step 2:
# - default (`automation`): development, tests and the e2e runner;
# - `--no-default-features`: the app as it ships.
[features]
default = ["automation"]
# `--automation`: the JSONL driver used by the e2e scenarios (docs/PLAN.md §12). Shipped builds
# are built without it.
automation = [
    "dep:gpui_automation",
    "gpui_automation/enabled",
    # Its commands' arguments name a mode, a material and an appearance by their keys.
    "gpui_appearance/serde",
    "dep:serde",
    "dep:serde_json",
    "sb_ui/automation",
]

[dependencies]
anyhow.workspace = true
clap.workspace = true
dirs.workspace = true
env_logger.workspace = true
gpui.workspace = true
# What the platform can show, probed at startup, and automation's `state` of it.
gpui_appearance.workspace = true
gpui_automation = { workspace = true, optional = true }
gpui_platform.workspace = true
log.workspace = true
# The providers and this machine's transport, which the services are started with.
sb_core.workspace = true
sb_ui.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

# macOS: text through Core Text needs gpui's `font-kit` (without it nothing draws), and
# `runtime_shaders` compiles the Metal shaders when the window opens, so building needs no
# Metal toolchain (Xcode's is a separate download).
[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { workspace = true, features = ["font-kit", "runtime_shaders"] }
# macOS's own allocator keeps the large blocks a closed session freed resident (PLAN §14), so
# the app there allocates with mimalloc, which returns them. Windows' returns them already.
mimalloc = { version = "0.1", default-features = false }
# mimalloc's own calls: `mi_collect`, which hands back what it holds free (`main.rs`).
libmimalloc-sys = { version = "0.1", features = ["extended"] }
# The other scrollback processes running from the app bundle, which applying an update ends
# (`processes.rs`).
libc.workspace = true

# Velopack, where scrollback is packaged: the installer's hooks and an installed copy's updates
# (`installer.rs`, `updates.rs`).
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
velopack.workspace = true

# The other scrollback processes running from an install, which applying an update ends
# (`processes.rs`), and the message box a windows-subsystem build reports with (`fatal.rs`).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

# scrollback.exe's icon and version resource on Windows (`build.rs`); a no-op elsewhere.
[build-dependencies]
embed-resource.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
tempfile.workspace = true
