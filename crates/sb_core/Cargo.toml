[package]
name = "sb_core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "scrollback's headless domain logic: the archive, sync, providers and search (docs/PLAN.md §3)"

# gpui: never, not even transitively (`script/check` step 3).
[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
base64.workspace = true
chrono.workspace = true
log.workspace = true
serde.workspace = true
# `raw_value`: a parser notes where a record's large parts are without copying them (PLAN §7.5).
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toolbox_process.workspace = true
toolbox_store.workspace = true
uuid.workspace = true
zstd.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
sb_test_support.workspace = true
