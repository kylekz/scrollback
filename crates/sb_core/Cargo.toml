[package]
name = "sb_core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "scrollback's headless domain logic: the archive, sync, providers and search (docs/PLAN.md §3)"

# gpui: never, not even transitively (`script/check` step 3).
[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
base64.workspace = true
chrono.workspace = true
log.workspace = true
serde.workspace = true
# `raw_value`: a parser notes where a record's large parts are without copying them (PLAN §7.5).
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toolbox_process.workspace = true
toolbox_store.workspace = true
uuid.workspace = true
zstd.workspace = true

# Unix only: the plain `fsync` std does not expose on Apple systems, and a volume's free space
# (`sb_core::archive`).
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs"] }

# The move into place that is on disk when it returns, a volume's free space and whether it is
# a network drive, and the codes of a file another program holds (`sb_core::archive`).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
pretty_assertions.workspace = true
sb_test_support.workspace = true
