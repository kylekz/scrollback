[package]
name = "sb_e2e"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "scrollback's e2e scenario runner: toolbox-rs's runner with scrollback's profile and fixtures (docs/PLAN.md §12)"

[[bin]]
name = "e2e"
path = "src/main.rs"

# gpui: never (`script/check` step 3). It drives `scrollback` over its stdio.
[dependencies]
anyhow.workspace = true
gpui_automation_runner.workspace = true
# The fixtures: generated transcripts, and an archive built from them with the real engine.
sb_core.workspace = true
sb_test_support.workspace = true
serde.workspace = true
serde_json.workspace = true
# The locations fixture dates a location's last sync back in its catalogue.
toolbox_store.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
tempfile.workspace = true
