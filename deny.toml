# cargo-deny, CI's dependencies job (.github/workflows/ci.yml): every crate comes from crates.io
# or the owner's toolbox-rs, carries a license on the list below, and has no open security
# advisory. A change to Cargo.lock that brings in a crate from anywhere else, or a crate RustSec
# flags, fails `cargo deny check` and so CI, and can't reach a release.

[graph]
all-features = true

[advisories]
# Yanked crates and every vulnerability fail; one that doesn't apply goes in `ignore` with why.
# Unmaintained crates fail only when the workspace depends on one directly: the rest come through
# gpui and its platform crates, which scrollback doesn't choose.
yanked = "deny"
unmaintained = "workspace"
ignore = [
    # zip 8 through velopack (=1.2.161, pinned to vpk; the installer's updates, PLAN §13). All
    # four are in zip's extraction: `ZipArchive::extract` and `ZipStreamReader::extract` keep
    # setuid bits, follow links out of the folder or abort on a symlink entry that declares a
    # huge size. velopack's library, the only part of it in scrollback, calls neither: it reads
    # entries one by one (`by_index`, `bundle.rs`). The archives it reads are the update packages
    # it downloaded, whose SHA256 it checks against the feed's: integrity, not authenticity, so
    # this rests on the library never extracting, not on the hash. `[bans]` keeps zip to
    # velopack alone. Goes when velopack moves to zip 9.
    { id = "RUSTSEC-2026-0367", reason = "zip via velopack, which never calls ZipArchive::extract or ZipStreamReader::extract" },
    { id = "RUSTSEC-2026-0368", reason = "zip via velopack, which never calls ZipArchive::extract or ZipStreamReader::extract" },
    { id = "RUSTSEC-2026-0369", reason = "zip via velopack, which never calls ZipArchive::extract or ZipStreamReader::extract" },
    { id = "RUSTSEC-2026-0429", reason = "zip via velopack, which never calls ZipArchive::extract or ZipStreamReader::extract" },
]

[licenses]
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

# webpki-roots, Mozilla's root certificates, through velopack's HTTP client (ureq): its data
# licence is allowed for it alone.
[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

[licenses.private]
# The workspace's own crates (publish = false) are this repository's MIT.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
# zip only through velopack, whose use of it the advisories above rest on.
deny = [{ crate = "zip", wrappers = ["velopack"] }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# toolbox-rs, the owner's shared crates (docs/PLAN.md §3), pinned by tag in Cargo.toml: the one
# source besides crates.io. A change to it goes to toolbox-rs first, then a new tag here.
allow-git = ["https://github.com/kylekz/toolbox-rs"]
